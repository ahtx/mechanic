[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanic-agent"
version = "0.1.0"
description = "Confirm-before-run Linux administration agent for AH-Mechanic-1-4B and any OpenAI-compatible endpoint"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Amir Husain"}]
dependencies = []

[project.scripts]
mechanic = "mechanic.cli:main"

[tool.setuptools]
packages = ["mechanic"]
